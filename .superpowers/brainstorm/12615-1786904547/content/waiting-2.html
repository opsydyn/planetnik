<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planetnik — refining the isometric city</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #dbe7ff; }
      main { width: min(720px, calc(100vw - 48px)); padding: 32px; border: 1px solid #2a395d; border-radius: 18px; background: #101a30; box-shadow: 0 24px 80px #0008; }
      .eyebrow { color: #89a9df; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
      h1 { margin: 10px 0 12px; font-size: clamp(26px, 5vw, 42px); line-height: 1.05; }
      p { margin: 0; color: #a9b9d7; line-height: 1.6; }
      .note { margin-top: 24px; padding: 14px 16px; border-left: 3px solid #76d6c0; background: #14243a; color: #cfe8e2; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Planetnik · Code City</div>
      <h1>Refining the isometric city grammar</h1>
      <p>The next design decision is the renderer boundary: a true interactive 3D scene or a lighter static-safe isometric renderer.</p>
      <div class="note">Context parcels are confirmed as the DDD-first geography.</div>
    </main>
  </body>
</html>
