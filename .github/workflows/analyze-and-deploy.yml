name: Analyze & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to analyze (owner/name or full URL)"
        required: false
        type: string
      ref:
        description: "Branch or tag to analyze"
        required: false
        default: "main"
        type: string
      name:
        description: "Project name override"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Planetnik
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Analyze repository
        run: |
          ARGS="--repo ${{ inputs.repo || github.repository }}"
          ARGS="$ARGS --ref ${{ inputs.ref || 'main' }}"
          ARGS="$ARGS --outputFolder _reports"
          if [ -n "${{ inputs.name }}" ]; then
            ARGS="$ARGS --name ${{ inputs.name }}"
          fi
          bun run apps/cli/src/index.ts analyzeRemote $ARGS

      - name: Build Astro site
        env:
          PLANETNIK_DATA_DIR: ${{ github.workspace }}/_reports/data
        working-directory: apps/site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: analyze-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
