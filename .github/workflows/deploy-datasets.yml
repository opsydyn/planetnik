name: Publish Hosted Datasets

on:
  push:
    branches: [main]
    paths:
      - datasets/**
      - apps/cli/**
      - packages/**
      - package.json
      - bun.lock
      - landscape-config.json
      - .github/workflows/deploy-datasets.yml
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: hosted-datasets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Sync datasets to Azure Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Planetnik
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun download cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare hosted landscape config
        id: landscape
        env:
          LANDSCAPE_GITHUB_TOKEN: ${{ secrets.LANDSCAPE_GITHUB_TOKEN }}
        run: |
          if [ -z "$LANDSCAPE_GITHUB_TOKEN" ]; then
            echo "LANDSCAPE_GITHUB_TOKEN secret is required for hosted dataset generation."
            exit 1
          fi

          bun -e '
            import { appendFileSync, readFileSync, writeFileSync } from "node:fs"

            const token = process.env.LANDSCAPE_GITHUB_TOKEN
            const output = process.env.GITHUB_OUTPUT
            if (!token) throw new Error("LANDSCAPE_GITHUB_TOKEN is required")
            if (!output) throw new Error("GITHUB_OUTPUT is required")

            const config = JSON.parse(readFileSync("landscape-config.json", "utf-8"))
            const githubOrgs = Array.isArray(config.githubOrgs) ? config.githubOrgs.filter(Boolean) : []
            if (githubOrgs.length !== 1) {
              throw new Error("landscape-config.json must define exactly one githubOrgs entry for hosted dataset generation")
            }

            config.githubToken = token
            writeFileSync("_landscape-config.hosted.json", JSON.stringify(config, null, 2), "utf-8")
            appendFileSync(output, `dataset_name=${githubOrgs[0]}\n`)
          '

      - name: Configure git credentials for landscape analysis
        env:
          LANDSCAPE_GITHUB_TOKEN: ${{ secrets.LANDSCAPE_GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${LANDSCAPE_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Generate hosted landscape dataset
        run: >-
          bun run apps/cli/src/index.ts analyzeLandscape
          --config _landscape-config.hosted.json
          --outputFolder datasets/${{ steps.landscape.outputs.dataset_name }}
          --concurrency 4

      - name: Verify hosted landscape security exports
        run: |
          DATA_DIR="${{ github.workspace }}/datasets/${{ steps.landscape.outputs.dataset_name }}/_planetnik_landscape/reports/data"
          test -f "$DATA_DIR/landscape_dependency_health.json" || {
            echo "Missing $DATA_DIR/landscape_dependency_health.json"
            echo "Hosted landscape security data was not exported. Check LANDSCAPE_GITHUB_TOKEN permissions and landscape config."
            exit 1
          }
          test -f "$DATA_DIR/landscape_dependency_alerts.json" || {
            echo "Missing $DATA_DIR/landscape_dependency_alerts.json"
            echo "Hosted landscape dependency alerts were not exported. Check LANDSCAPE_GITHUB_TOKEN permissions and landscape config."
            exit 1
          }

      - name: Validate dataset tree
        shell: bash
        run: |
          if [ ! -d datasets ]; then
            echo "datasets/ directory is missing after CI dataset generation"
            exit 1
          fi

          SENTINELS=$(find datasets -type f \( -name report_context.json -o -name landscape_overview.json -o -name analysisResults.json \) | wc -l | tr -d ' ')
          if [ "$SENTINELS" -eq 0 ]; then
            echo "No recognized Planetnik dataset sentinel files were found under datasets/."
            echo "Expected one or more of: report_context.json, landscape_overview.json, analysisResults.json"
            exit 1
          fi

          echo "Found $SENTINELS recognized dataset sentinel files."

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve dataset storage account
        id: storage
        shell: bash
        run: |
          ACCOUNT_NAME=$(az resource list \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --resource-type "Microsoft.Storage/storageAccounts" \
            --query "[0].name" \
            --output tsv)

          if [ -z "$ACCOUNT_NAME" ]; then
            echo "storage_ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Hosted dataset publish skipped"
              echo "- Reason: dataset storage account is not provisioned yet in ${{ vars.RESOURCE_GROUP }}"
              echo "- Next step: run the infrastructure workflow with apply enabled, then rerun this workflow"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --account-name "$ACCOUNT_NAME" \
            --query "[0].value" \
            --output tsv)

          if [ -z "$ACCOUNT_KEY" ]; then
            echo "Failed to resolve storage account key for $ACCOUNT_NAME"
            exit 1
          fi

          echo "storage_ready=true" >> "$GITHUB_OUTPUT"
          echo "account_name=$ACCOUNT_NAME" >> "$GITHUB_OUTPUT"
          echo "account_key=$ACCOUNT_KEY" >> "$GITHUB_OUTPUT"

      - name: Upload datasets to Azure Files share
        if: steps.storage.outputs.storage_ready == 'true'
        shell: bash
        run: |
          az storage file upload-batch \
            --account-name "${{ steps.storage.outputs.account_name }}" \
            --account-key "${{ steps.storage.outputs.account_key }}" \
            --destination datasets \
            --destination-path "${{ steps.landscape.outputs.dataset_name }}" \
            --source "datasets/${{ steps.landscape.outputs.dataset_name }}" \
            --max-connections 32 \
            --no-progress

      - name: Verify uploaded sentinel files
        if: steps.storage.outputs.storage_ready == 'true'
        shell: bash
        run: |
          # This step checks files in the Azure Files share, so paths must be
          # relative to the `datasets` share root rather than runner-local paths
          # like `${{ github.workspace }}/datasets/...`.
          #
          # upload-batch writes to:
          #   share `datasets` / destination-path `${{ steps.landscape.outputs.dataset_name }}`
          # so the remote report data root becomes:
          #   <dataset_name>/_planetnik_landscape/reports/data
          DATA_DIR="${{ steps.landscape.outputs.dataset_name }}/_planetnik_landscape/reports/data"
          for relative_path in \
            "$DATA_DIR/report_context.json" \
            "$DATA_DIR/landscape_overview.json" \
            "$DATA_DIR/landscapeAnalysisResults.json" \
            "$DATA_DIR/landscape_dependency_health.json" \
            "$DATA_DIR/landscape_dependency_alerts.json"
          do
            az storage file exists \
              --account-name "${{ steps.storage.outputs.account_name }}" \
              --account-key "${{ steps.storage.outputs.account_key }}" \
              --share-name datasets \
              --path "$relative_path" \
              --query exists \
              --output tsv | grep -qx true
          done

      - name: Workflow summary
        if: steps.storage.outputs.storage_ready == 'true'
        shell: bash
        run: |
          echo "### Hosted dataset publish complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storage account: ${{ steps.storage.outputs.account_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Share: datasets" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dataset: ${{ steps.landscape.outputs.dataset_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: datasets/${{ steps.landscape.outputs.dataset_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upload parallelism: 32 connections" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: overwrite in place (no pre-delete)" >> "$GITHUB_STEP_SUMMARY"
