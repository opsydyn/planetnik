name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Override deploy mode (reads from planetnik.config.json if not set)"
        required: false
        type: choice
        options:
          - ""
          - single_repository
          - landscape
      repo:
        description: "Repository to analyze (single_repository mode only)"
        required: false
        type: string
      ref:
        description: "Branch or tag to analyze (single_repository mode only)"
        required: false
        default: "main"
        type: string
      name:
        description: "Project or landscape name override"
        required: false
        type: string
      config:
        description: "Landscape config path (landscape mode only)"
        required: false
        default: "landscape-config.json"
        type: string
      concurrency:
        description: "Parallel repo analysis count (landscape mode only)"
        required: false
        default: "4"
        type: string
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Planetnik
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun download cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Resolve deploy mode
        id: mode
        run: |
          INPUT_MODE="${{ inputs.mode }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=$(jq -r '.mode // "landscape"' planetnik.config.json 2>/dev/null || echo "landscape")
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          else
            MODE=$(jq -r '.mode // "single_repository"' planetnik.config.json 2>/dev/null || echo "single_repository")
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          fi
          echo "### Deploy mode: $(cat "$GITHUB_OUTPUT" | grep mode= | cut -d= -f2)" >> "$GITHUB_STEP_SUMMARY"

      # ── Single repository analysis ──

      - name: Analyze repository
        if: steps.mode.outputs.mode == 'single_repository'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          ARGS="--repo ${{ inputs.repo || github.repository }}"
          ARGS="$ARGS --ref ${{ inputs.ref || 'main' }}"
          ARGS="$ARGS --outputFolder _reports"
          if [ -n "${{ inputs.name }}" ]; then
            ARGS="$ARGS --name ${{ inputs.name }}"
          fi
          bun run apps/cli/src/index.ts analyzeRemote $ARGS

      # ── Landscape analysis ──

      - name: Prepare landscape config
        if: steps.mode.outputs.mode == 'landscape'
        env:
          LANDSCAPE_GITHUB_TOKEN: ${{ secrets.LANDSCAPE_GITHUB_TOKEN }}
          LANDSCAPE_CONFIG_PATH: ${{ inputs.config || 'landscape-config.json' }}
        run: |
          if [ -z "$LANDSCAPE_GITHUB_TOKEN" ]; then
            echo "LANDSCAPE_GITHUB_TOKEN secret is required for landscape analysis."
            exit 1
          fi
          bun -e '
            import { readFileSync, writeFileSync } from "node:fs";

            const input = process.env.LANDSCAPE_CONFIG_PATH;
            const token = process.env.LANDSCAPE_GITHUB_TOKEN;

            if (!input) throw new Error("LANDSCAPE_CONFIG_PATH is required");
            if (!token) throw new Error("LANDSCAPE_GITHUB_TOKEN is required");

            const config = JSON.parse(readFileSync(input, "utf-8"));
            config.githubToken = token;
            writeFileSync("_landscape-config.json", JSON.stringify(config, null, 2), "utf-8");
          '

      - name: Configure git credentials (landscape)
        if: steps.mode.outputs.mode == 'landscape'
        env:
          LANDSCAPE_GITHUB_TOKEN: ${{ secrets.LANDSCAPE_GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${LANDSCAPE_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Run landscape analysis
        if: steps.mode.outputs.mode == 'landscape'
        run: >-
          bun run apps/cli/src/index.ts analyzeLandscape
          --config _landscape-config.json
          --outputFolder _landscape
          --concurrency ${{ inputs.concurrency || '4' }}
          ${{ inputs.name && format('--name "{0}"', inputs.name) || '' }}

      # ── Build and upload ──

      - name: Build Astro site (single repository)
        if: steps.mode.outputs.mode == 'single_repository'
        env:
          PLANETNIK_DATA_DIR: ${{ github.workspace }}/_reports/data
        working-directory: apps/site
        run: bun run build

      - name: Build Astro site (landscape)
        if: steps.mode.outputs.mode == 'landscape'
        env:
          PLANETNIK_LANDSCAPE_DATA_DIR: ${{ github.workspace }}/_landscape/_planetnik_landscape/reports/data
        working-directory: apps/site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/site/dist

  deploy:
    needs: analyze-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
