name: Landscape Analysis

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Path to landscape config JSON in this repo"
        required: true
        default: "landscape-config.json"
        type: string
      name:
        description: "Landscape name"
        required: false
        type: string
      concurrency:
        description: "Parallel repo analysis count"
        required: false
        default: "4"
        type: string
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landscape
  cancel-in-progress: true

jobs:
  analyze-landscape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Planetnik
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Prepare landscape config
        env:
          LANDSCAPE_GITHUB_TOKEN: ${{ secrets.LANDSCAPE_GITHUB_TOKEN }}
          LANDSCAPE_CONFIG_PATH: ${{ inputs.config || 'landscape-config.json' }}
        run: |
          if [ -z "$LANDSCAPE_GITHUB_TOKEN" ]; then
            echo "LANDSCAPE_GITHUB_TOKEN secret is required for landscape analysis."
            exit 1
          fi
          bun -e '
            import { readFileSync, writeFileSync } from "node:fs";

            const input = process.env.LANDSCAPE_CONFIG_PATH;
            const token = process.env.LANDSCAPE_GITHUB_TOKEN;

            if (!input) throw new Error("LANDSCAPE_CONFIG_PATH is required");
            if (!token) throw new Error("LANDSCAPE_GITHUB_TOKEN is required");

            const config = JSON.parse(readFileSync(input, "utf-8"));
            config.githubToken = token;
            writeFileSync("_landscape-config.json", JSON.stringify(config, null, 2), "utf-8");
          '

      - name: Run landscape analysis
        run: |
          ARGS="--config _landscape-config.json"
          ARGS="$ARGS --outputFolder _landscape"
          ARGS="$ARGS --concurrency ${{ inputs.concurrency || '4' }}"
          if [ -n "${{ inputs.name }}" ]; then
            ARGS="$ARGS --name '${{ inputs.name }}'"
          fi
          bun run apps/cli/src/index.ts analyzeLandscape $ARGS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _landscape/_planetnik_landscape/reports

  deploy:
    needs: analyze-landscape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
