name: Landscape Analysis

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Path to landscape config JSON in this repo"
        required: true
        default: "landscape-config.json"
        type: string
      name:
        description: "Landscape name"
        required: false
        type: string
      concurrency:
        description: "Parallel repo analysis count"
        required: false
        default: "4"
        type: string
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landscape
  cancel-in-progress: true

jobs:
  analyze-landscape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Planetnik
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run landscape analysis
        run: |
          ARGS="--config ${{ inputs.config || 'landscape-config.json' }}"
          ARGS="$ARGS --outputFolder _landscape"
          ARGS="$ARGS --concurrency ${{ inputs.concurrency || '4' }}"
          if [ -n "${{ inputs.name }}" ]; then
            ARGS="$ARGS --name '${{ inputs.name }}'"
          fi
          bun run apps/cli/src/index.ts analyzeLandscape $ARGS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _landscape/_planetnik_landscape/reports

  deploy:
    needs: analyze-landscape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
